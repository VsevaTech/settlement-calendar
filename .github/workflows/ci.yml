name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check .
        run: ruff check .

      - name: pytest
        run: pytest

      - name: Verify the demo dataset is reproducible
        run: |
          python -m app.demo.generate --as-of 2026-09-17 --out /tmp/demo-check
          diff -u demo-data/payments.csv /tmp/demo-check/payments.csv
          diff -u demo-data/settlements.csv /tmp/demo-check/settlements.csv

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t settlement-calendar:ci .

      - name: Start container on an empty database
        run: |
          docker run -d --name sc -p 8000:8000 -e SC_AS_OF_DATE=2026-09-17 settlement-calendar:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/ > /dev/null

      - name: Container logs
        if: always()
        run: docker logs sc || true

      - name: Stop container
        if: always()
        run: docker rm -f sc || true
