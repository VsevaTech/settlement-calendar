# UAE banking calendar.
#
# UAE banks and the UAE Funds Transfer System do not settle on official public
# holidays. Islamic holidays follow moon sighting and are often *transferred* by
# Cabinet decision to a Friday or a Monday, so the dates below are the officially
# announced (observed) dates, not the astronomical Hijri dates.
#
# Always confirm against your acquirer's own settlement calendar before relying
# on it. Add or correct dates on the Holidays page or by uploading a CSV.

code = "AE"
name = "UAE banking calendar"
weekend_days = [6, 7]  # Saturday + Sunday since January 2022
source = "Official UAE announcements (MoHRE / UAE Cabinet), 2026; National Day provisional"

