# TARGET / T2 closing days (euro RTGS, Eurosystem).
#
# The ECB defines a fixed set of closing days: New Year's Day, Good Friday,
# Easter Monday, 1 May, Christmas Day and 26 December. On these days no euro
# interbank settlement happens, so EUR payouts slip to the next TARGET day.

code = "TARGET2"
name = "TARGET2 (EUR) calendar"
weekend_days = [6, 7]
source = "ECB - TARGET closing days (fixed rule), 2026-2027"

[[holidays]]
date = 2026-01-01
name = "New Year's Day"

